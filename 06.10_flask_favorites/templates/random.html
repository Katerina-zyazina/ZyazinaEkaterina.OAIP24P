<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Случайный фильм</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; }
        .movie { background: #f5f5f5; padding: 25px; border-radius: 8px; text-align: center; }
        .movie h1 { color: #333; }
        .info { font-size: 18px; color: #555; margin: 10px 0; }
        .rating { font-size: 24px; color: #e67e22; font-weight: bold; margin: 15px 0; }
        .btn { display: inline-block; padding: 10px 20px; background: #0066cc; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; }
        .btn:hover { background: #0052a3; }
    </style>
</head>
<body>
    <div class="movie">
        <h1>🎲 Случайный фильм</h1>
        <h2>{{ movie.title }}</h2>
        <p class="info">📅 Год выпуска: {{ movie.year }}</p>
        <p class="info">🎭 Жанр: {{ movie.genre }}</p>
        <p class="rating">⭐ Рейтинг: {{ movie.rating }}</p>
        <a class="btn" href="/random">🔄 Ещё один случайный</a>
        <a class="btn" href="/" style="background: #27ae60;">← На главную</a>
    </div>
</body>
</html>
